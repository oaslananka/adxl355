<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi 5 to ADXL355 verified SPI wiring</title>
  <desc id="desc">A wiring diagram showing Raspberry Pi 5 physical pin 1 3.3 volts to ADXL355 3.3 volts, pin 6 ground to ground, pin 23 GPIO11 to SCLK, pin 19 GPIO10 to MOSI, pin 21 GPIO9 to MISO, pin 24 GPIO8 chip enable zero to chip select, and optional pin 11 GPIO17 to data ready. The fixture was verified with SPI mode zero at one megahertz.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700">Raspberry Pi 5 ↔ ADXL355 — verified SPI fixture</text>
  <text x="600" y="88" text-anchor="middle" font-family="sans-serif" font-size="18">SPI Mode 0 · 1 MHz · physical identity AD 1D ED 01</text>

  <rect x="70" y="130" width="410" height="500" rx="18" fill="#eef6ff" stroke="#24557a" stroke-width="3"/>
  <text x="275" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700">Raspberry Pi 5</text>
  <text x="275" y="202" text-anchor="middle" font-family="sans-serif" font-size="16">40-pin header — physical pin numbers</text>

  <rect x="720" y="130" width="410" height="500" rx="18" fill="#f4fff0" stroke="#3c6d2a" stroke-width="3"/>
  <text x="925" y="174" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700">ADXL355 breakout</text>
  <text x="925" y="202" text-anchor="middle" font-family="sans-serif" font-size="16">3.3 V logic and supply</text>

  <g font-family="sans-serif" font-size="18">
    <text x="105" y="258">Pin 1 · 3V3</text>
    <text x="105" y="318">Pin 6 · GND</text>
    <text x="105" y="378">Pin 23 · GPIO11 / SCLK</text>
    <text x="105" y="438">Pin 19 · GPIO10 / MOSI</text>
    <text x="105" y="498">Pin 21 · GPIO9 / MISO</text>
    <text x="105" y="558">Pin 24 · GPIO8 / CE0</text>
    <text x="105" y="608">Pin 11 · GPIO17 (optional)</text>

    <text x="895" y="258">3.3 V / VDDIO</text>
    <text x="895" y="318">GND</text>
    <text x="895" y="378">SCLK</text>
    <text x="895" y="438">MOSI / SDA</text>
    <text x="895" y="498">MISO / ASEL</text>
    <text x="895" y="558">CS</text>
    <text x="895" y="608">DRDY</text>
  </g>

  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M 470 250 C 575 250, 625 250, 730 250" stroke="#c33b32"/>
    <path d="M 470 310 C 575 310, 625 310, 730 310" stroke="#333333"/>
    <path d="M 470 370 C 575 370, 625 370, 730 370" stroke="#b98b16"/>
    <path d="M 470 430 C 575 430, 625 430, 730 430" stroke="#3178b8"/>
    <path d="M 470 490 C 575 490, 625 490, 730 490" stroke="#7656a6"/>
    <path d="M 470 550 C 575 550, 625 550, 730 550" stroke="#2f8c4c"/>
    <path d="M 470 600 C 575 600, 625 600, 730 600" stroke="#7a7a7a" stroke-dasharray="14 12"/>
  </g>

  <g fill="#ffffff" stroke-width="3">
    <circle cx="470" cy="250" r="9" stroke="#c33b32"/><circle cx="730" cy="250" r="9" stroke="#c33b32"/>
    <circle cx="470" cy="310" r="9" stroke="#333333"/><circle cx="730" cy="310" r="9" stroke="#333333"/>
    <circle cx="470" cy="370" r="9" stroke="#b98b16"/><circle cx="730" cy="370" r="9" stroke="#b98b16"/>
    <circle cx="470" cy="430" r="9" stroke="#3178b8"/><circle cx="730" cy="430" r="9" stroke="#3178b8"/>
    <circle cx="470" cy="490" r="9" stroke="#7656a6"/><circle cx="730" cy="490" r="9" stroke="#7656a6"/>
    <circle cx="470" cy="550" r="9" stroke="#2f8c4c"/><circle cx="730" cy="550" r="9" stroke="#2f8c4c"/>
    <circle cx="470" cy="600" r="9" stroke="#7a7a7a"/><circle cx="730" cy="600" r="9" stroke="#7a7a7a"/>
  </g>

  <text x="600" y="674" text-anchor="middle" font-family="sans-serif" font-size="16">Dashed DRDY connection is optional; the maintained HIL runner polls STATUS.DATA_RDY over SPI.</text>
  <text x="600" y="702" text-anchor="middle" font-family="sans-serif" font-size="14">Repository-authored diagram · MIT licensed · not a Raspberry Pi or Analog Devices logo/artwork derivative</text>
</svg>
