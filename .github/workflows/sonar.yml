name: SonarQube Cloud

on:
  push:
    branches: [main]
    paths:
      - "c/**"
      - "cpp/**"
      - "embedded/**"
      - "go/**"
      - "node/**"
      - "python/**"
      - "rust/**"
      - "scripts/**"
      - "spec/**"
      - ".github/workflows/**"
      - "sonar-project.properties"
      - "VERSION"
  pull_request:
    branches: [main]
    paths:
      - "c/**"
      - "cpp/**"
      - "embedded/**"
      - "go/**"
      - "node/**"
      - "python/**"
      - "rust/**"
      - "scripts/**"
      - "spec/**"
      - ".github/workflows/**"
      - "sonar-project.properties"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: SonarQube Cloud
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/python/ci-test.txt

      - name: Install Python coverage tooling
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements/python/ci-test.txt

      - name: Set up Rust with Clippy
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: clippy

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
          cache: false

      - name: Generate Go coverage
        working-directory: go
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build C and C++ compilation databases
        run: |
          cmake -S c -B sonar-build/c \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON
          cmake --build sonar-build/c --parallel 2

          cmake -S cpp -B sonar-build/cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON \
            -DADXL355_C_LIB="$GITHUB_WORKSPACE/sonar-build/c/libadxl355.a" \
            -DADXL355_C_INCLUDE_DIR="$GITHUB_WORKSPACE/c/include"
          cmake --build sonar-build/cpp --parallel 2

          python - <<'PY'
          import json
          from pathlib import Path

          entries = []
          for source in (
              Path("sonar-build/c/compile_commands.json"),
              Path("sonar-build/cpp/compile_commands.json"),
          ):
              payload = json.loads(source.read_text(encoding="utf-8"))
              if not isinstance(payload, list):
                  raise SystemExit(f"invalid compilation database: {source}")
              entries.extend(payload)

          unique = {}
          for entry in entries:
              key = (
                  str(entry.get("file", "")),
                  str(entry.get("directory", "")),
                  str(entry.get("command", entry.get("arguments", ""))),
              )
              unique[key] = entry
          output = Path("sonar-build/compile_commands.json")
          output.write_text(
              json.dumps([unique[key] for key in sorted(unique)], indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"wrote {len(unique)} compilation commands to {output}")
          PY

      - name: Generate Python coverage
        run: |
          python -m coverage run --branch \
            --include='*/scripts/sonar_summary.py,*/spec/generate_c_header.py' \
            -m unittest \
              scripts.tests.test_sonar_integration \
              scripts.tests.test_security_regressions
          python -m coverage xml -o sonar-build/python-coverage.xml
          python -m coverage report --fail-under=80

      - name: Read canonical project version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Analyze with SonarQube Cloud
        id: scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}

      - name: Publish bounded Sonar summary
        if: always() && steps.scan.outcome != 'skipped'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(
            --project-key oaslananka_adxl355
            --attempts 60
            --interval-seconds 2
            --soft-fail
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--pull-request "$PR_NUMBER")
          else
            args+=(--branch "$BRANCH_NAME")
          fi
          python scripts/sonar_summary.py "${args[@]}" > "$GITHUB_STEP_SUMMARY"
