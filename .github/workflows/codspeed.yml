name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions: {}

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed
    defaults:
      run:
        working-directory: benchmarks/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
      - name: Install cargo-codspeed
        run: cargo install --locked cargo-codspeed@5.0.3
      - name: Build benchmarks
        run: cargo codspeed build -m simulation
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          working-directory: benchmarks/rust
          run: cargo codspeed run

  c:
    name: C core benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build benchmarks
        run: |
          cmake -S benchmarks/c -B build/bench-c -DCODSPEED_MODE=simulation
          cmake --build build/bench-c --parallel
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: ./build/bench-c/adxl355_c_bench
