name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_EXTRA_INDEX_URL: ""

jobs:
  # ── C ────────────────────────────────────────────────────────────────
  c:
    name: C (GCC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Configure warnings and sanitizers
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DADXL355_BUILD_TESTS=ON
          -DADXL355_BUILD_EXAMPLES=ON
          -DADXL355_WARNINGS_AS_ERRORS=ON
          -DADXL355_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # ── C++ ──────────────────────────────────────────────────────────────
  cpp:
    name: C++ (GCC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build C core
        run: |
          cmake -S ${{ github.workspace }}/c -B ${{ github.workspace }}/c/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=OFF \
            -DADXL355_BUILD_EXAMPLES=OFF \
            -DADXL355_WARNINGS_AS_ERRORS=ON
          cmake --build ${{ github.workspace }}/c/build --parallel
      - name: Configure warnings and sanitizers
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DADXL355_BUILD_TESTS=ON
          -DADXL355_BUILD_EXAMPLES=ON
          -DADXL355_WARNINGS_AS_ERRORS=ON
          -DADXL355_ENABLE_SANITIZERS=ON
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/c/build
      - name: Build
        run: cmake --build build --parallel
      - name: Test with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Verify installed CMake packages
        working-directory: ${{ github.workspace }}
        run: ./scripts/smoke_cmake_packages.sh "${{ runner.temp }}/cmake-package-smoke"

  # ── Native platform coverage ───────────────────────────────────────────
  native-clang:
    name: Native (Clang/Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang and CMake
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Build and test C with Clang
        env:
          CC: clang
        run: |
          cmake -S c -B build/clang/c \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON \
            -DADXL355_ENABLE_SANITIZERS=ON
          cmake --build build/clang/c --parallel
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir build/clang/c --output-on-failure
      - name: Build and test C++ with Clang
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S cpp -B build/clang/cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON \
            -DADXL355_ENABLE_SANITIZERS=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/clang/c"
          cmake --build build/clang/cpp --parallel
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            ctest --test-dir build/clang/cpp --output-on-failure
      - name: Verify installed packages with Clang
        env:
          CC: clang
          CXX: clang++
        run: ./scripts/smoke_cmake_packages.sh "${{ runner.temp }}/cmake-clang-smoke"

  native-macos:
    name: Native (macOS/arm64)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test C with AppleClang
        run: |
          cmake -S c -B build/macos/c \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON
          cmake --build build/macos/c --parallel
          ctest --test-dir build/macos/c --output-on-failure
      - name: Build and test C++ with AppleClang
        run: |
          cmake -S cpp -B build/macos/cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/macos/c"
          cmake --build build/macos/cpp --parallel
          ctest --test-dir build/macos/cpp --output-on-failure
      - name: Verify installed packages
        run: ./scripts/smoke_cmake_packages.sh "${{ runner.temp }}/cmake-macos-smoke"

  native-windows:
    name: Native (Windows/MSVC)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test C with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S c -B build/windows/c -A x64 `
            -DADXL355_BUILD_TESTS=ON `
            -DADXL355_BUILD_EXAMPLES=ON `
            -DADXL355_WARNINGS_AS_ERRORS=ON
          cmake --build build/windows/c --config Debug --parallel
          ctest --test-dir build/windows/c -C Debug --output-on-failure
      - name: Build and test C++ with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S cpp -B build/windows/cpp -A x64 `
            -DADXL355_BUILD_TESTS=ON `
            -DADXL355_BUILD_EXAMPLES=ON `
            -DADXL355_WARNINGS_AS_ERRORS=ON `
            "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/windows/c"
          cmake --build build/windows/cpp --config Debug --parallel
          ctest --test-dir build/windows/cpp -C Debug --output-on-failure
      - name: Verify installed packages
        shell: pwsh
        run: ./scripts/smoke_cmake_packages.ps1 "${{ runner.temp }}/cmake-windows-smoke"

  native-arm:
    name: Native (Linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake and compilers
        run: sudo apt-get update && sudo apt-get install -y cmake gcc g++
      - name: Build and test C on ARM64
        run: |
          cmake -S c -B build/arm64/c \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON
          cmake --build build/arm64/c --parallel
          ctest --test-dir build/arm64/c --output-on-failure
      - name: Build and test C++ on ARM64
        run: |
          cmake -S cpp -B build/arm64/cpp \
            -DCMAKE_BUILD_TYPE=Debug \
            -DADXL355_BUILD_TESTS=ON \
            -DADXL355_BUILD_EXAMPLES=ON \
            -DADXL355_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/arm64/c"
          cmake --build build/arm64/cpp --parallel
          ctest --test-dir build/arm64/cpp --output-on-failure
      - name: Verify installed packages
        run: ./scripts/smoke_cmake_packages.sh "${{ runner.temp }}/cmake-arm64-smoke"

  # ── Python ────────────────────────────────────────────────────────────
  python:
    name: Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked test runner
        run: >
          python -m pip install --disable-pip-version-check
          --require-hashes --no-deps --only-binary=:all:
          -r ../requirements/python/ci-test.txt
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: python -m pytest -v
      - name: Install hash-locked quality and package tools
        if: matrix.python-version == '3.12'
        run: >
          python -m pip install --disable-pip-version-check
          --require-hashes --no-deps --only-binary=:all:
          -r ../requirements/python/ci-quality.txt
      - name: Lint with Ruff
        if: matrix.python-version == '3.12'
        run: ruff check src tests examples
      - name: Type check with strict mypy
        if: matrix.python-version == '3.12'
        run: mypy src examples
      - name: Build and verify wheel
        if: matrix.python-version == '3.12'
        run: |
          rm -rf build dist
          python -m build --no-isolation
          python -m venv "${{ runner.temp }}/adxl355-wheel"
          "${{ runner.temp }}/adxl355-wheel/bin/python" -m pip install \
            --disable-pip-version-check --no-deps dist/*.whl
          EXPECTED_VERSION="$(PYTHONPATH=.. python -c \
            'from pathlib import Path; from scripts.versioning import load_version; print(load_version(Path("..")).python)')"
          EXPECTED_VERSION="$EXPECTED_VERSION" \
            "${{ runner.temp }}/adxl355-wheel/bin/python" -c \
            "import os, adxl355; assert adxl355.__version__ == os.environ['EXPECTED_VERSION']"
          "${{ runner.temp }}/adxl355-wheel/bin/python" examples/basic_read.py
          "${{ runner.temp }}/adxl355-wheel/bin/python" examples/calibrate.py

  # ── Rust ──────────────────────────────────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check all targets and features
        run: cargo check --all-targets --all-features
      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Lint optional HAL without default features
        run: cargo clippy --no-default-features --features hal -- -D warnings
      - name: Test all features
        run: cargo test --all-features
      - name: Test no_std configuration
        run: cargo test --no-default-features
      - name: Test documentation
        run: cargo test --doc --all-features
      - name: Verify crate package
        run: cargo package

  # ── Node.js ───────────────────────────────────────────────────────────
  node:
    name: Node.js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: node
    strategy:
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: node/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build reviewed optional native adapters
        run: npm rebuild spi-device i2c-bus --foreground-scripts
      - name: Verify optional native adapters load
        run: npm run native:check
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Verify package contents
        if: matrix.node-version == '24'
        run: npm run pack:check
      - name: Verify core-only clean install
        if: matrix.node-version == '24'
        run: npm run pack:core-only
      - name: Audit dependencies
        if: matrix.node-version == '24'
        run: npm run audit:ci

  # ── Go ────────────────────────────────────────────────────────────────
  go:
    name: Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
          cache: false
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Verify module and build targets
        run: |
          go mod verify
          go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=arm go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Generate coverage report
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  # ── Embedded C++ compile fixture ─────────────────────────────────────
  embedded:
    name: Embedded (Arduino Uno)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked PlatformIO Core
        run: >
          python -m pip install --disable-pip-version-check
          --require-hashes --no-deps --only-binary=:all:
          -r requirements/python/platformio.txt
      - name: Verify command-scoped PlatformIO dependency boundary
        run: |
          python -c 'import importlib.metadata as m, importlib.util as u; r="\n".join(m.requires("platformio") or []); e={"starlette":"starlette<0.53,>=0.19","uvicorn":"uvicorn<0.41,>=0.16","wsproto":"wsproto==1.*"}; [(d in r and u.find_spec(p) is None) or (_ for _ in ()).throw(AssertionError(p)) for p,d in e.items()]'
          pio --version
      - name: Verify Arduino library package contents
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/platformio
        run: |
          mkdir -p artifacts/platformio
          pio pkg pack . --output artifacts/platformio/adxl355-arduino.tar.gz
          tar -tzf artifacts/platformio/adxl355-arduino.tar.gz > artifacts/platformio/contents.txt
          grep -Fx 'c/src/adxl355.c' artifacts/platformio/contents.txt
          grep -Fx 'cpp/include/adxl355/adxl355.hpp' artifacts/platformio/contents.txt
          grep -Fx 'embedded/arduino/include/adxl355/arduino_spi.hpp' artifacts/platformio/contents.txt
          if grep -E '(^|/)(node_modules|target|build|dist|artifacts)/' artifacts/platformio/contents.txt; then
            echo 'Generated or build-only content leaked into the Arduino package' >&2
            exit 1
          fi
      - name: Compile exception-free Arduino Uno fixture
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/platformio
        run: pio run -d embedded/platformio/uno

  # ── Bounded fuzz smoke ────────────────────────────────────────────────
  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang and CMake
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Configure Clang libFuzzer target
        run: >
          cmake -S c -B build/fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DADXL355_BUILD_FUZZERS=ON
          -DADXL355_ENABLE_SANITIZERS=ON
          -DADXL355_WARNINGS_AS_ERRORS=ON
      - name: Build libFuzzer target
        run: cmake --build build/fuzz --target fuzz_adxl355 --parallel
      - name: Run bounded C fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p artifacts/fuzz
          build/fuzz/fuzz/fuzz_adxl355             -runs=10000             -max_total_time=30             -timeout=2             -rss_limit_mb=1024             -max_len=1024             -print_final_stats=1             -artifact_prefix=artifacts/fuzz/             scripts/fuzz_corpus/raw
      - name: Run deterministic Python and release-tool mutation smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
        run: >
          python scripts/fuzz_python_boundaries.py
          --iterations 10000
          --seed 355
      - name: Upload bounded crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers-${{ github.run_id }}
          path: artifacts/fuzz
          if-no-files-found: ignore
          retention-days: 5

  # ── Required shared-vector gate ────────────────────────────────────────
  consistency:
    name: Cross-language Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [c, cpp, native-clang, native-macos, native-windows, native-arm, python, rust, node, go, embedded, fuzz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc g++
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: node/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
          cache: false
      - name: Install hash-locked verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r requirements/python/consistency.txt
          python -m pip install --disable-pip-version-check \
            --no-build-isolation --no-deps -e ./python
          python scripts/generate_python_locks.py --verify
      - name: Verify canonical package versions
        run: python scripts/versioning.py
      - name: Check public API compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_public_api.py --base-ref "$BASE_SHA"
          else
            python scripts/check_public_api.py
          fi
      - name: Verify generated API references
        run: python scripts/generate_api_reference.py --verify
      - name: Run required cross-language vector gate
        run: python scripts/verify_vectors.py --ci
      - name: Test release and CI automation
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

  # ── Stable aggregate test gate ───────────────────────────────────────
  tests:
    name: Tests
    if: always()
    needs:
      - c
      - cpp
      - native-clang
      - native-macos
      - native-windows
      - native-arm
      - python
      - rust
      - node
      - go
      - embedded
      - fuzz
      - consistency
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce every CI result
        env:
          C: ${{ needs.c.result }}
          CPP: ${{ needs.cpp.result }}
          NATIVE_CLANG: ${{ needs.native-clang.result }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
          NATIVE_ARM: ${{ needs.native-arm.result }}
          PYTHON: ${{ needs.python.result }}
          RUST: ${{ needs.rust.result }}
          NODE: ${{ needs.node.result }}
          GO: ${{ needs.go.result }}
          EMBEDDED: ${{ needs.embedded.result }}
          FUZZ: ${{ needs.fuzz.result }}
          CONSISTENCY: ${{ needs.consistency.result }}
        run: |
          for result in \
            "$C" "$CPP" \
            "$NATIVE_CLANG" "$NATIVE_MACOS" "$NATIVE_WINDOWS" "$NATIVE_ARM" \
            "$PYTHON" "$RUST" "$NODE" "$GO" \
            "$EMBEDDED" "$FUZZ" "$CONSISTENCY"; do
            test "$result" = success
          done
